kind = "web"
previewPath = "/django-admin/"
title = "Django Admin"

[[services]]
localPort = 8000
name = "Django Admin"
paths = ["/django-admin"]

[services.development]
run = "bash /home/runner/workspace/artifacts/django-admin/start.sh"

[services.production]

[services.production.build]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/django-admin && python manage.py collectstatic --noinput"]

[services.production.run]
args = ["bash", "/home/runner/workspace/artifacts/django-admin/start.sh"]

[services.production.run.env]
PORT = "8000"
NODE_ENV = "production"
